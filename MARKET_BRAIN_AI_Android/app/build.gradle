plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.marketbrain.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.marketbrain.ai'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.6.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
